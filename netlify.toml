[build]
  command = "npm run build"
  publish = "dist/server"
  functions = "dist/server"

# Serve the app through a Node.js function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200
  force = true

# Serve static assets from client directory
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
